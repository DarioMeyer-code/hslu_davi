name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Zwei Jobs wie in der GitHub-Vorlage: Der Deploy startet erst, wenn der Upload
# vollständig abgeschlossen ist. Mit beidem in einem Job und den alten Versionen
# (upload-pages-artifact@v3 / deploy-pages@v4) fand der Deploy ab Nov. 2026 das
# hochgeladene Paket nicht mehr («Found 0 artifact(s)»).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5